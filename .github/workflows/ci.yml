name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python — résumé generator & PDF verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: python -m pip install --upgrade pip python-docx pytest
      - name: Run tests
        run: pytest -q

  dashboard:
    name: Dashboard — metrics
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm install
      - name: Run tests
        run: npm test
